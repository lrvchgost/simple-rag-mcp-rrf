name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Tests (pytest)
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag-kb-mcp:ci .

  eval-retrieval:
    # Retrieval-eval на tech-подмножестве golden-набора.
    # Без chat-LLM: find_relevant_docs не требует qwen, тянем только nomic.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eval deps
        run: pip install requests
      - name: Start stack (ollama + rag-mcp, без ollama-init)
        run: docker compose up -d --no-deps --build ollama rag-mcp
      - name: Wait for MCP server
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' \
              -X POST http://localhost:8000/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
              || true)
            if [ "$code" = "200" ]; then
              echo "MCP server is up (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "MCP server did not start"; docker compose logs rag-mcp; exit 1
      - name: Pull embedding model
        run: docker compose exec -T ollama ollama pull nomic-embed-text
      - name: Index demo root docs
        run: |
          SID=$(curl -s -D - -o /dev/null -X POST http://localhost:8000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            | grep -i mcp-session-id | awk '{print $2}' | tr -d '\r')
          curl -s -X POST http://localhost:8000/mcp -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' -H "mcp-session-id: $SID" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' > /dev/null
          curl -sf -X POST http://localhost:8000/mcp -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' -H "mcp-session-id: $SID" \
            -d '{"jsonrpc":"2.0","id":9,"method":"tools/call","params":{"name":"index_folder","arguments":{"folder_path":"/data/docs","glob_pattern":"*"}}}' \
            | grep -o 'status[^,]*ok' | head -1
      - name: Retrieval eval (tech subset)
        run: python scripts/eval_retrieval.py --filter tech --fail-under 0.9
