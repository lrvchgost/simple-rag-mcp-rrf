# Конфиг учебной «библиотеки Комбре» (тестовые данные для RAG)

library:
  name: Combray-Library
  cycle: "В поисках утраченного времени"
  VOLUME_COUNT: 7
  publication_window: [1913, 1927]

memory:
  trigger: madeleine          # сцена-триггер для демонстрации непроизвольной памяти
  steeping_seconds: 30        # сколько мадленка лежит в чае, прежде чем её съесть
  voluntary: false            # произвольная память не возвращает час целиком

reading:
  order: linear               # читать тома по порядку: 1 -> 7
  madeleine_volume: 1         # том, в котором случается сцена с мадленкой
  ball_volume: 7              # «бал шляп» в финале

courses:
  themes: [память, время, ревность, снобизм, искусство]
  required_characters: [Шарль Сван, Одетта, Шарлюс, Альбертина, Вентей]
