# Config of the training «Combray Library» (test data for RAG)

library:
  name: Combray-Library
  cycle: "In Search of Lost Time"
  VOLUME_COUNT: 7
  publication_window: [1913, 1927]

memory:
  trigger: madeleine          # trigger scene for involuntary memory demo
  steeping_seconds: 30        # how long the madeleine steeps in the tea
  voluntary: false            # voluntary memory does not return the whole hour

reading:
  order: linear               # read the volumes in order: 1 -> 7
  madeleine_volume: 1         # the volume with the madeleine scene
  ball_volume: 7              # the «bal de têtes» in the finale

courses:
  themes: [memory, time, jealousy, snobism, art]
  required_characters: [Charles Swann, Odette, Charlus, Albertine, Vinteuil]
